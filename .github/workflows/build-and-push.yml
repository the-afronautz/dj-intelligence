name: Build and push container image

# Builds the Docker image and pushes it to GitHub Container Registry
# (ghcr.io/the-afronautz/vinyl-analyzer) on every push to main that
# touches the app, the Dockerfile, or this workflow.
#
# Uses the auto-provided GITHUB_TOKEN so no secrets need to be configured.

on:
  push:
    branches: [main]
    paths:
      - 'vinyl_analyzer/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vinyl-analyzer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable provenance + SBOM attestations. They produce a multi-entry
          # manifest list (linux/amd64 + unknown/unknown) which Azure App
          # Service's container runtime can't parse — it errors with
          # ContainerCreateFailure on pull.
          provenance: false
          sbom: false
          platforms: linux/amd64
